name: ElestyaBedrock
version: '${version}'

main: org.elestya.bedrock.ElestyaBedrock
api-version: '1.21.11'
load: POSTWORLD

authors: [ TablePasDroite ]

commands:
  bedrock:
    description: open default menu
  color:
    description: show color render
  metierdebug:
    description: modify a profession level for debugging
    usage: /metierdebug <metier> <niveau>
  update:
    description: afficher les dernières modifications du plugin

depend:
  - Geyser-Spigot
  - floodgate
